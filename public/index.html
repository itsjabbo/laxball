<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LaxBall</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- scoreboard -->
  <div id="hud" class="hidden">
    <div class="sb">
      <span class="chip red"></span><span id="scoreR">0</span>
      <span class="dash">-</span>
      <span id="scoreB">0</span><span class="chip blue"></span>
      <span id="clock">00:00</span>
      <span id="ot" class="hidden">OT</span>
    </div>
  </div>

  <div id="banner" class="hidden"><div id="bannerBig"></div><div id="bannerSmall"></div></div>
  <div id="pausedNote" class="hidden">PAUSED</div>

  <!-- chat -->
  <div id="chat">
    <div id="chatlog"></div>
    <input id="chatinput" maxlength="140" autocomplete="off" placeholder="Press Enter to chat">
  </div>

  <div id="hint" class="hidden">Esc: room menu</div>

  <!-- join screen -->
  <div id="joinScreen" class="overlay">
    <form id="joinForm" class="panel join">
      <div class="logo">Lax<span>Ball</span></div>
      <p class="tag">2D lacrosse for your local network</p>
      <label>Nickname<input id="nick" maxlength="20" required autocomplete="off"></label>
      <label>Avatar <small>(1–2 characters, optional)</small><input id="avatar" maxlength="4" autocomplete="off"></label>
      <button type="submit" class="btn primary">Join game</button>
      <div id="joinStatus" class="muted"></div>
    </form>
  </div>

  <!-- room / lobby -->
  <div id="roomScreen" class="overlay hidden">
    <div class="panel room">
      <div class="roomHead">
        <div class="logo small">Lax<span>Ball</span></div>
        <div id="roomState" class="muted"></div>
        <button id="closeRoom" class="btn ghost hidden" title="Back to the game (Esc)">✕</button>
      </div>

      <div class="teams">
        <div class="col red" data-team="1">
          <div class="colHead">Red</div>
          <ul class="plist" data-team="1"></ul>
          <div class="colBtns">
            <button class="btn joinTeam" data-team="1">Join</button>
            <button class="btn adminOnly addBot" data-team="1" title="Add a computer player">+ Bot</button>
          </div>
        </div>
        <div class="col spec" data-team="0">
          <div class="colHead">Spectators</div>
          <ul class="plist" data-team="0"></ul>
          <div class="colBtns">
            <button class="btn joinTeam" data-team="0">Spectate</button>
          </div>
        </div>
        <div class="col blue" data-team="2">
          <div class="colHead">Blue</div>
          <ul class="plist" data-team="2"></ul>
          <div class="colBtns">
            <button class="btn joinTeam" data-team="2">Join</button>
            <button class="btn adminOnly addBot" data-team="2" title="Add a computer player">+ Bot</button>
          </div>
        </div>
      </div>

      <div class="roomCtl">
        <label class="adminOnly">Score limit
          <select id="scoreLimit"><option value="0">None</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>7</option><option>10</option></select>
        </label>
        <label class="adminOnly">Time limit
          <select id="timeLimit"><option value="0">None</option><option value="1">1 min</option><option value="2">2 min</option><option value="3">3 min</option><option value="5">5 min</option><option value="7">7 min</option><option value="10">10 min</option></select>
        </label>
        <button id="removeBots" class="btn adminOnly">Remove bots</button>
        <div class="spacer"></div>
        <button id="pauseBtn" class="btn adminOnly hidden">Pause</button>
        <button id="startBtn" class="btn primary adminOnly">Start game</button>
        <div id="notAdmin" class="muted">Waiting for the admin to start…</div>
      </div>

      <div class="roomFoot">
        <div class="controls">
          <b>Move</b> Arrows / WASD &nbsp; <b>Throw</b> hold &amp; release Space (longer = harder) &nbsp;
          <b>Check</b> X or Shift &nbsp; <b>Chat</b> Enter &nbsp; <b>Menu</b> Esc
        </div>
        <div class="opts">
          <label><input type="checkbox" id="optMouse"> Aim with mouse (click = throw, right‑click = check)</label>
          <label><input type="checkbox" id="optSound" checked> Sound</label>
        </div>
      </div>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
